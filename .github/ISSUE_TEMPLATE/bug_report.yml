name: Bug report
description: Report a defect in mcp-server-iterm2
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please fill in the sections below so we can reproduce the problem.

        **Security issues:** stop here and use [GitHub Security Advisories](https://github.com/r6e/mcp-server-iterm2/security/advisories/new) instead — see [SECURITY.md](https://github.com/r6e/mcp-server-iterm2/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A clear description of the unexpected behavior.
      placeholder: When I call `get_screen_contents` with session_id=X, the server returns Y instead of Z.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug.
      placeholder: |
        1. Start the server with `uvx mcp-server-iterm2`
        2. Call tool `X` with arguments `{...}`
        3. Observe the error in the MCP client log
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-server-iterm2 version
      description: Output of `uvx mcp-server-iterm2 --version` or the version pinned in your MCP config.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.13.0"
    validations:
      required: true

  - type: input
    id: iterm2
    attributes:
      label: iTerm2 version
      description: iTerm2 → About iTerm2.
      placeholder: Build 3.5.x
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: System Settings → General → About, "macOS" line.
      placeholder: macOS 15.x
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      description: Which client is invoking the server (Claude Desktop, Claude Code, custom, ...)
      placeholder: Claude Code 1.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server stderr, MCP client error output, or stack traces. Paste in code fences. Redact anything sensitive.
      render: text
