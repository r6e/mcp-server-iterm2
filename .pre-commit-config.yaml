repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest tests/unit
        language: system
        types: [python]
        pass_filenames: false
